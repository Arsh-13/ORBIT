[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.2.0"
description = "ORBIT personal assistant - Milestone 1: read-only scanner with exact duplicate detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",  # used by FastAPI's TestClient
]

[tool.setuptools.packages.find]
include = ["orbit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
